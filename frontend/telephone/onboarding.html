<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aura Max — Bienvenue</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<div class="screen-phone">
  <div style="padding: 28px 28px 0;">
    <span class="wordmark" style="font-size: 22px;">AURA</span>
  </div>
  <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 28px; padding: 32px;">
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <span style="font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-dim);">Salle connectée</span>
      <h1 class="font-display" style="margin: 0; font-size: 46px; line-height: 1;">Bienvenue</h1>
      <p style="margin: 0; color: var(--text-dim); font-size: 16px; line-height: 1.5;">Choisis ton avatar et ton pseudo pour rejoindre la partie.</p>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <span style="font-size: 13px; color: var(--text-dim);">Ton avatar</span>
      <div id="avatar-picker" style="display: flex; gap: 10px;"></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <label for="pseudo" style="font-size: 13px; color: var(--text-dim);">Pseudo</label>
      <input id="pseudo" name="pseudo" type="text" placeholder="Ton pseudo" style="background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; color: var(--text); font-size: 17px; font-family: 'Space Grotesk', sans-serif;">
    </div>
    <div style="display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 18px 20px;">
      <svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true">
        <circle cx="18" cy="18" r="16" fill="none" stroke="#FF2E9E" stroke-width="2.5"></circle>
        <circle cx="18" cy="18" r="9" fill="none" stroke="#FF2E9E" stroke-width="1.5" opacity="0.6"></circle>
      </svg>
      <strong style="font-size: 16px;">1000 $AURA offerts</strong>
    </div>
  </div>
  <div style="padding: 24px 28px 36px;">
    <a href="warmup.html" class="btn-cta" id="join-cta">Rejoindre la partie</a>
  </div>
</div>

<script>
  // Six original goofy-face avatars. Selecting one just picks an index for now —
  // wire this up to whatever identity/session store you use for the player.
  const AVATARS = [
    { fill: '#FF2E9E', draw: (id) => `
      <circle cx="20" cy="20" r="18" fill="#FF2E9E"></circle>
      <circle cx="14" cy="17" r="4.2" fill="#170013"></circle>
      <circle cx="27" cy="16" r="4.2" fill="#170013"></circle>
      <circle cx="15" cy="16" r="1.3" fill="#FFFFFF"></circle>
      <circle cx="28" cy="15" r="1.3" fill="#FFFFFF"></circle>
      <path d="M12 25 Q20 34 28 25" fill="none" stroke="#170013" stroke-width="2.4" stroke-linecap="round"></path>
      <ellipse cx="20" cy="29" rx="3.4" ry="4.5" fill="#FF7A9B"></ellipse>` },
    { fill: '#FF6FC4', draw: () => `
      <circle cx="20" cy="20" r="18" fill="#FF6FC4"></circle>
      <path d="M10 16 Q13.5 13 17 16" fill="none" stroke="#170013" stroke-width="2.2" stroke-linecap="round"></path>
      <circle cx="26" cy="16" r="4.4" fill="#170013"></circle>
      <circle cx="27" cy="15" r="1.3" fill="#FFFFFF"></circle>
      <path d="M11 25 Q20 32 29 24" fill="none" stroke="#170013" stroke-width="2.4" stroke-linecap="round"></path>
      <rect x="18" y="26" width="4" height="4" fill="#FFFFFF"></rect>` },
    { fill: '#D946A8', draw: () => `
      <circle cx="20" cy="20" r="18" fill="#D946A8"></circle>
      <path d="M9 11 L17 14" fill="none" stroke="#170013" stroke-width="2" stroke-linecap="round"></path>
      <path d="M31 11 L23 14" fill="none" stroke="#170013" stroke-width="2" stroke-linecap="round"></path>
      <circle cx="14" cy="18" r="5" fill="#170013"></circle>
      <circle cx="26" cy="18" r="5" fill="#170013"></circle>
      <circle cx="14" cy="18" r="1.6" fill="#FFFFFF"></circle>
      <circle cx="26" cy="18" r="1.6" fill="#FFFFFF"></circle>
      <ellipse cx="20" cy="29" rx="4.5" ry="3.4" fill="#170013"></ellipse>` },
    { fill: '#B34DFF', draw: () => `
      <circle cx="20" cy="20" r="18" fill="#B34DFF"></circle>
      <path d="M10 17 Q14 13 18 17" fill="none" stroke="#170013" stroke-width="2.4" stroke-linecap="round"></path>
      <path d="M22 17 Q26 13 30 17" fill="none" stroke="#170013" stroke-width="2.4" stroke-linecap="round"></path>
      <path d="M10 24 Q20 33 30 24 Q20 30 10 24" fill="#170013"></path>
      <rect x="17" y="24.5" width="6" height="3" fill="#FFFFFF"></rect>` },
    { fill: '#7C3AED', draw: () => `
      <circle cx="20" cy="20" r="18" fill="#7C3AED"></circle>
      <circle cx="15" cy="17" r="4" fill="#170013"></circle>
      <circle cx="25" cy="17" r="4" fill="#170013"></circle>
      <circle cx="16.5" cy="17" r="1.2" fill="#FFFFFF"></circle>
      <circle cx="23.5" cy="17" r="1.2" fill="#FFFFFF"></circle>
      <path d="M13 27 Q20 24 27 27" fill="none" stroke="#170013" stroke-width="2.4" stroke-linecap="round"></path>
      <circle cx="11" cy="23" r="1.1" fill="#170013" opacity="0.5"></circle>
      <circle cx="29" cy="23" r="1.1" fill="#170013" opacity="0.5"></circle>` },
    { fill: '#FF8FD4', draw: () => `
      <circle cx="20" cy="20" r="18" fill="#FF8FD4"></circle>
      <path d="M9 16 Q13 12 17 16" fill="none" stroke="#170013" stroke-width="2.2" stroke-linecap="round"></path>
      <circle cx="25" cy="17" r="4.4" fill="#170013"></circle>
      <circle cx="26.2" cy="16" r="1.3" fill="#FFFFFF"></circle>
      <path d="M11 24 Q17 31 24 26" fill="none" stroke="#170013" stroke-width="2.4" stroke-linecap="round"></path>
      <ellipse cx="27" cy="30" rx="3" ry="4" fill="#FF7A9B" transform="rotate(20 27 30)"></ellipse>` },
  ];

  let selected = 0;
  const picker = document.getElementById('avatar-picker');

  function buttonStyle(isSelected) {
    return 'width:44px;height:44px;padding:0;border-radius:50%;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;background:transparent;border:3px solid ' +
      (isSelected ? '#F8F3F7;box-shadow:0 0 0 3px rgba(255,46,158,0.4);' : 'transparent;opacity:0.75;');
  }

  function render() {
    picker.innerHTML = AVATARS.map((a, i) => `
      <button type="button" data-avatar="${i}" aria-pressed="${i === selected}" aria-label="Avatar ${i + 1}" style="${buttonStyle(i === selected)}">
        <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true">${a.draw()}</svg>
      </button>`).join('');
    picker.querySelectorAll('[data-avatar]').forEach((btn) => {
      btn.addEventListener('click', () => {
        selected = Number(btn.dataset.avatar);
        render();
      });
    });
  }
  render();

  // Carry the chosen avatar + pseudo forward — swap sessionStorage for your
  // real session/auth layer once the backend exists.
  document.getElementById('join-cta').addEventListener('click', () => {
    try {
      sessionStorage.setItem('auraMax.avatar', String(selected));
      sessionStorage.setItem('auraMax.pseudo', document.getElementById('pseudo').value || 'Joueur');
    } catch (e) { /* storage unavailable — non-blocking */ }
  });
</script>
</body>
</html>
