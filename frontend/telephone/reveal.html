<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aura Max — Reveal #1</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../assets/style.css">
<style>
  @keyframes numberPulse {
    0%, 100% { text-shadow: 0 0 40px rgba(255,46,158,0.6); transform: scale(1); }
    50% { text-shadow: 0 0 80px rgba(255,46,158,1); transform: scale(1.03); }
  }
</style>
</head>
<body>
<div class="screen-phone">
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 20px 24px 0;">
    <span style="background: var(--magenta); color: #170013; border-radius: 999px; padding: 6px 14px; font-size: 12px; font-weight: 700; letter-spacing: 1px;">REVEAL #1 · 10S</span>
    <span class="font-display" data-role="time" style="font-size: 18px; color: var(--text);">20s</span>
  </div>
  <div style="flex: 1.4; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 6px; text-align: center; padding: 12px;">
    <span class="font-display" style="font-size: 32px; letter-spacing: 1px; color: var(--text);">UP PAIE</span>
    <span class="font-display" style="font-size: 128px; line-height: 0.95; color: var(--magenta); animation: numberPulse 1.2s ease-in-out infinite;">×1,8</span>
    <span style="font-size: 15px; letter-spacing: 2px; color: var(--text-dim); text-transform: uppercase;">En ce moment</span>
    <span style="margin-top: 18px; font-size: 13px; color: var(--text-faint);">44% UP · 56% DOWN</span>
  </div>
  <div id="round-toggle" style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 0 28px;">
    <button type="button" class="toggle-btn" data-camp="up" style="font-size:24px;padding:22px 0;">UP</button>
    <button type="button" class="toggle-btn" data-camp="down" style="font-size:24px;padding:22px 0;">DOWN</button>
  </div>
  <div style="padding: 18px 28px 32px; display: flex; justify-content: center;">
    <span class="balance-chip">Mise&nbsp;: 200 $AURA</span>
  </div>
</div>

<script type="module">
  import { createRoundToggle } from '../assets/round-timer.js';

  let initialCamp = 'up';
  try { initialCamp = sessionStorage.getItem('auraMax.round.camp') || 'up'; } catch (e) {}

  // >>> INTEGRATION POINT <<<
  // The ×1.8 multiplier and 44/56 split shown above are static demo values.
  // Both must come from the live pool state (total UP stake vs total DOWN
  // stake) computed server-side, pushed down at the t=10s reveal event —
  // this is the moment the design brief calls "multiplier-first reveal".
  createRoundToggle(document.getElementById('round-toggle'), {
    initialCamp,
    initialTimeLeft: 20,
    roundLength: 30,
    cooldownSeconds: 4,
    onCampChange: (camp) => {
      try { sessionStorage.setItem('auraMax.round.camp', camp); } catch (e) {}
    },
  });
</script>
</body>
</html>
